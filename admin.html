<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>管理后台 · 单词本</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="page-atmosphere" aria-hidden="true"></div>
    <div class="admin-layout">
      <!-- 侧边栏 -->
      <aside class="admin-sidebar">
        <div class="sidebar-header">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/>
              <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"/>
            </svg>
          </div>
          <div class="brand-text">
            <strong>单词本</strong>
            <span>管理后台</span>
          </div>
        </div>
        
        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="words">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span>词库管理</span>
          </button>
          
          <button class="nav-item" data-view="image-gen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
            <span>图片生成</span>
          </button>
          
          <button class="nav-item" data-view="stats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
            <span>统计数据</span>
          </button>
          
          <button class="nav-item" data-view="users">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>用户管理</span>
          </button>
        </nav>
        
        <div class="sidebar-footer">
          <div class="user-info">
            <div class="user-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <div class="user-details">
              <strong id="username-display">管理员</strong>
              <span id="role-display">管理员</span>
            </div>
          </div>
          <button class="logout-button" id="logout-button" title="退出并切换账号">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </aside>
      
      <!-- 主内容区 -->
      <main class="admin-main">
        <!-- 词库管理视图 -->
        <div id="words-view" class="admin-view active">
          <header class="view-header">
            <div>
              <h1>词库管理</h1>
              <p>管理所有单词和释义</p>
            </div>
            <div class="header-actions">
              <input type="search" id="word-search" class="search-input" placeholder="搜索单词..." />
              <button type="button" id="add-word-btn" class="primary-action">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg>
                <span>新增单词</span>
              </button>
              <span class="word-count">共 <strong id="total-words">0</strong> 个单词</span>
            </div>
          </header>
          
          <div class="words-grid" id="words-grid">
            <div class="loading-state">
              <div class="spinner"></div>
              <p>加载中...</p>
            </div>
          </div>
        </div>
        
        <!-- 图片生成视图 -->
        <div id="image-gen-view" class="admin-view">
          <header class="view-header">
            <div>
              <h1>AI 图片生成</h1>
              <p>批量生成和管理单词联想图</p>
            </div>
          </header>
          
          <div class="gen-controls">
            <div class="gen-status">
              <div class="status-card">
                <span class="status-label">待生成</span>
                <strong class="status-value" id="pending-count">0</strong>
              </div>
              <div class="status-card">
                <span class="status-label">生成中</span>
                <strong class="status-value" id="generating-count">0</strong>
              </div>
              <div class="status-card">
                <span class="status-label">已完成</span>
                <strong class="status-value" id="completed-count">0</strong>
              </div>
            </div>
            
            <div class="gen-actions">
              <button class="primary-action" id="start-batch-gen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m12 3 1.2 3.3L16.5 7.5l-3.3 1.2L12 12l-1.2-3.3-3.3-1.2 3.3-1.2L12 3Z"/>
                  <path d="m18.5 13 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/>
                </svg>
                <span>批量生成图片</span>
              </button>
              
              <select id="batch-size" class="batch-select">
                <option value="5">每批 5 个</option>
                <option value="10" selected>每批 10 个</option>
                <option value="20">每批 20 个</option>
              </select>
            </div>
          </div>
          
          <div class="gen-log" id="gen-log">
            <p class="log-empty">尚未开始生成任务</p>
          </div>
        </div>
        
        <!-- 统计数据视图 -->
        <div id="stats-view" class="admin-view">
          <header class="view-header">
            <div>
              <h1>统计数据</h1>
              <p>系统使用情况概览</p>
            </div>
          </header>
          
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon" style="background: var(--green-soft); color: var(--green)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                </svg>
              </div>
              <div class="stat-content">
                <span class="stat-label">词库总数</span>
                <strong class="stat-value" id="stat-total-words">-</strong>
              </div>
            </div>
            
            <div class="stat-card">
              <div class="stat-icon" style="background: var(--blue-soft); color: var(--blue)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                </svg>
              </div>
              <div class="stat-content">
                <span class="stat-label">已配图单词</span>
                <strong class="stat-value" id="stat-with-images">-</strong>
              </div>
            </div>
            
            <div class="stat-card">
              <div class="stat-icon" style="background: var(--orange-soft); color: var(--orange)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <path d="M12 6v6l4 2"/>
                </svg>
              </div>
              <div class="stat-content">
                <span class="stat-label">平均图片版本</span>
                <strong class="stat-value" id="stat-avg-version">-</strong>
              </div>
            </div>
          </div>
          
          <div class="info-panel">
            <h3>系统信息</h3>
            <dl class="info-list">
              <div class="info-item">
                <dt>数据库状态</dt>
                <dd id="db-status">检查中...</dd>
              </div>
              <div class="info-item">
                <dt>AI 图片生成</dt>
                <dd id="ai-status">检查中...</dd>
              </div>
              <div class="info-item">
                <dt>服务器时间</dt>
                <dd id="server-time">-</dd>
              </div>
            </dl>
          </div>
        </div>
        
        <!-- 用户管理视图 -->
        <div id="users-view" class="admin-view">
          <header class="view-header">
            <div>
              <h1>用户管理</h1>
              <p>查看和管理所有注册账户及学习进度</p>
            </div>
            <div class="header-actions">
              <input type="search" id="user-search" class="search-input" placeholder="搜索用户名..." />
              <span class="word-count">共 <strong id="total-users">0</strong> 个账户</span>
            </div>
          </header>
          
          <div class="users-table-wrap">
            <table class="users-table">
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>角色</th>
                  <th>创建时间</th>
                  <th>最后登录</th>
                  <th>进度</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
          
          <div id="user-detail" class="user-detail"></div>
        </div>
      </main>
    </div>
    
    <script type="module" src="admin.js"></script>
  </body>
</html>
