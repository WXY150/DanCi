<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>登录 · 单词本</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="page-atmosphere" aria-hidden="true"></div>
    <main class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/>
              <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"/>
            </svg>
          </div>
          <h1>单词本</h1>
          <p id="login-subtitle">登录后学习进度将同步到你的账号，可跨设备使用</p>
        </div>

        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">登录</button>
          <button type="button" class="auth-tab" data-tab="signup">注册</button>
        </div>

        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="username">用户名</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="请输入用户名"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">密码</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </div>

          <div id="error-message" class="error-message" role="alert"></div>

          <button type="submit" class="login-button" id="login-button">
            <span class="button-text">登录</span>
            <span class="button-spinner" style="display:none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" opacity="0.25"/>
                <path d="M12 2 A10 10 0 0 1 22 12" stroke-linecap="round"/>
              </svg>
            </span>
          </button>
        </form>

        <div class="login-footer">
          <p class="login-note">普通用户可直接注册；注册后进入学习，管理员登录进入后台</p>
        </div>
      </div>
    </main>

    <script type="module" src="login.js"></script>
  </body>
</html>
